<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sasha Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 16px; }
h1 { font-size: 20px; margin-bottom: 16px; color: var(--tg-theme-accent-text-color, #2481cc); }
.tab { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tab button { flex: 1; padding: 10px; border: 1px solid var(--tg-theme-hint-color, #ccc); background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 8px; cursor: pointer; font-size: 14px; min-width: 60px; }
.tab button.active { background: var(--tg-theme-accent-text-color, #2481cc); color: #fff; border-color: var(--tg-theme-accent-text-color, #2481cc); }
.section { display: none; }
.section.active { display: block; }
.card { background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.card h3 { font-size: 13px; color: var(--tg-theme-hint-color, #888); margin-bottom: 4px; }
.card .val { font-size: 16px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 8px 4px; border-bottom: 1px solid var(--tg-theme-hint-color, #ddd); }
.loading { text-align: center; padding: 40px; color: var(--tg-theme-hint-color, #888); }
.error { color: red; padding: 16px; text-align: center; }
</style>
</head>
<body>
<h1>Sasha</h1>
<div class="tab">
  <button class="active" onclick="showTab('expenses')">Expenses</button>
  <button onclick="showTab('movements')">Movements</button>
  <button onclick="showTab('todos')">Todos</button>
  <button onclick="showTab('digest')">Digest</button>
</div>
<div id="expenses" class="section active"><div class="loading">Loading...</div></div>
<div id="movements" class="section"><div class="loading">Loading...</div></div>
<div id="todos" class="section"><div class="loading">Loading...</div></div>
<div id="digest" class="section"><div class="loading">Loading...</div></div>

<script>
const SUPABASE_URL = 'https://wxrdudmtishleicfgoqv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cmR1ZG10aXNobGVpY2Znb3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI2MzU2NTMsImV4cCI6MjA1ODIxMTY1M30.vCiFN8IGy2s9ELP1S-HVHxjQ4yEVcLNgnV7W34v6M_o';

const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const userId = tg.initDataUnsafe?.user?.id;
if (!userId) {
  document.body.innerHTML = '<div class="error">Please open from Telegram</div>';
}

const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab button').forEach(b => b.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  document.querySelector(`.tab button[onclick*="${name}"]`).classList.add('active');
}

async function loadData() {
  // Expenses
  const { data: expenses } = await supabase
    .from('expenses')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: false })
    .limit(20);
  document.getElementById('expenses').innerHTML = expenses?.length
    ? '<table>' + expenses.map(e =>
        `<tr><td>${e.description || e.category || ''}</td><td><strong>${e.amount || ''}</strong></td><td style="text-align:right;font-size:12px;color:var(--tg-theme-hint-color)">${e.created_at?.slice(0,10)||''}</td></tr>`
      ).join('') + '</table>'
    : '<div class="card"><p>No expenses yet. Say "coffee $5" to Sasha!</p></div>';

  // Movements
  const { data: movements } = await supabase
    .from('movements')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: false })
    .limit(20);
  document.getElementById('movements').innerHTML = movements?.length
    ? '<table>' + movements.map(m =>
        `<tr><td>📍 ${m.location}</td><td style="text-align:right;font-size:12px;color:var(--tg-theme-hint-color)">${m.created_at?.replace('T',' ').slice(0,16)||''}</td></tr>`
      ).join('') + '</table>'
    : '<div class="card"><p>No movements yet. Say "at work" to Sasha!</p></div>';

  // Todos
  const { data: todos } = await supabase
    .from('tasks')
    .select('*')
    .eq('user_id', userId)
    .eq('done', false)
    .order('created_at', { ascending: false })
    .limit(20);
  document.getElementById('todos').innerHTML = todos?.length
    ? '<table>' + todos.map(t =>
        `<tr><td>☐ ${t.title}</td></tr>`
      ).join('') + '</table>'
    : '<div class="card"><p>All done! Say "add task" to Sasha.</p></div>';

  // Digest
  document.getElementById('digest').innerHTML =
    '<div class="card"><p>📋 Say <b>"how did I spend this week?"</b> or <b>"digest now"</b> in chat to get your daily digest.</p></div>';
}

loadData();
</script>
</body>
</html>

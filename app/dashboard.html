<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sasha Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0f0f13;
  --surface: #1a1a22;
  --surface2: #222230;
  --border: rgba(255,255,255,0.06);
  --text: #f0f0f5;
  --text2: #8e8ea0;
  --text3: #5c5c6e;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --red: #ff6b6b;
  --green: #51cf66;
  --orange: #ffa94d;
  --blue: #74c0fc;
  --radius: 14px;
  --radius-sm: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ─── Header ──────────────────────────────────── */
.header {
  padding: 16px 20px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-date {
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}
.header-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
}
.currency-toggle {
  display: flex;
  gap: 3px;
  background: var(--surface2);
  border-radius: 8px;
  padding: 2px;
}
.currency-toggle button {
  padding: 4px 12px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--text3);
  transition: all 0.15s;
}
.currency-toggle button.active {
  background: var(--accent);
  color: #fff;
}

/* ─── Summary Cards ───────────────────────────── */
.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 20px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px 16px;
  border: 1px solid var(--border);
}
.summary-card.wide { grid-column: 1 / -1; }
.summary-label {
  font-size: 11px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
  margin-bottom: 6px;
}
.summary-value {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
}
.summary-value.red { color: var(--red); }
.summary-value.green { color: var(--green); }
.summary-sub {
  font-size: 11px;
  color: var(--text3);
  margin-top: 4px;
}

/* ─── Tabs ────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 0 20px 16px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.tab {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
  text-align: center;
  white-space: nowrap;
}
.tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35);
}

/* ─── Tip banner ──────────────────────────────── */
.tip-banner {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin: 0 20px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
}
.tip-banner b { color: var(--accent2); }
.tip-banner .tip-close {
  float: right;
  background: none;
  border: none;
  color: var(--text3);
  font-size: 16px;
  cursor: pointer;
  margin: -4px -4px 0 0;
}

/* ─── Content ─────────────────────────────────── */
.content {
  padding: 0 20px 100px;
}
.section { display: none; }
.section.active { display: block; }

/* ─── Date Group ──────────────────────────────── */
.date-group { margin-bottom: 20px; }
.date-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 8px;
  padding-left: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.date-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ─── Item Row ────────────────────────────────── */
.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  border: 1px solid var(--border);
  transition: transform 0.1s, background 0.15s;
  position: relative;
  overflow: hidden;
}
.item:active { transform: scale(0.98); }
.item-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.item-icon.expense { background: rgba(255,107,107,0.12); }
.item-icon.income { background: rgba(81,207,102,0.12); }
.item-icon.movement { background: rgba(116,192,252,0.12); }
.item-icon.todo { background: rgba(162,155,254,0.12); }
.item-icon.event { background: rgba(255,169,77,0.12); }
.item-body {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.item-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-meta {
  font-size: 12px;
  color: var(--text3);
  margin-top: 2px;
}
.item-amount {
  font-size: 15px;
  font-weight: 800;
  flex-shrink: 0;
  letter-spacing: -0.3px;
}
.item-amount.red { color: var(--red); }
.item-amount.green { color: var(--green); }
.item-delete {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: none;
  background: rgba(255,107,107,0.1);
  color: var(--red);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.2s;
}
.item:hover .item-delete,
.item:active .item-delete { opacity: 1; }
@media (hover: none) {
  .item-delete { opacity: 0.5; }
}

/* ─── Todo checkbox ───────────────────────────── */
.todo-check {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--text3);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.todo-check.done {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
  font-size: 12px;
}
.todo-title.done {
  text-decoration: line-through;
  color: var(--text3);
}

/* ─── Empty State ─────────────────────────────── */
.empty {
  text-align: center;
  padding: 40px 20px;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.4;
}
.empty-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 6px;
}
.empty-sub {
  font-size: 13px;
  color: var(--text3);
  line-height: 1.6;
}
.empty-commands {
  margin-top: 16px;
  text-align: left;
  max-width: 280px;
  margin-left: auto;
  margin-right: auto;
}
.cmd-row {
  display: flex;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
  align-items: baseline;
}
.cmd-row .cmd {
  color: var(--accent2);
  font-weight: 600;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  flex-shrink: 0;
}
.cmd-row .cmd-desc {
  color: var(--text3);
}

/* ─── Event card ──────────────────────────────── */
.event-card {
  background: var(--surface);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  padding: 14px 16px;
  margin-bottom: 6px;
  border-left: 3px solid var(--orange);
}
.event-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.event-time {
  font-size: 12px;
  color: var(--text3);
}

/* ─── Category bars ───────────────────────────── */
.cat-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 10px;
}
.cat-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}
.cat-bar-wrap { margin-bottom: 10px; }
.cat-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 4px;
}
.cat-bar-label span:first-child { color: var(--text2); font-weight: 500; }
.cat-bar-label span:last-child { color: var(--text3); }
.cat-bar {
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.cat-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}

/* ─── Error / Loading ─────────────────────────── */
.error-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--red);
  font-size: 14px;
}
.error-state p { margin-top: 8px; color: var(--text3); font-size: 13px; }
.loading-wrap {
  display: flex;
  justify-content: center;
  padding: 48px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--surface2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Balance line ────────────────────────────── */
.balance-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.balance-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.balance-dot.red { background: var(--red); }
.balance-dot.green { background: var(--green); }
.balance-text {
  font-size: 12px;
  color: var(--text3);
}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>Sasha</h1>
    <div class="header-date" id="headerDate"></div>
  </div>

    <div class="currency-toggle" id="currencyToggle"></div>
  </div>
</div>

<div class="summary" id="summary"></div>
<div class="tabs" id="tabs"></div>
<div id="tipArea"></div>
<div class="content" id="content">
  <div class="loading-wrap"><div class="spinner"></div></div>
</div>

tg.expand();
tg.ready();

const userId = tg.initDataUnsafe?.user?.id;
if (!userId) {

}

// ─── i18n ──────────────────────────────────────────

  },

let currentTab = 'expenses';
let lang = 'en';
const hiddenTips = new Set();

function t(key) { return (T[lang] || T.en)[key] || T.en[key]; }

// ─── Date helpers ──────────────────────────────────
const RU_MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const RU_WEEKDAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const EN_WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function formatHeaderDate() {
  const d = new Date();
  if (lang === 'ru') return `${RU_WEEKDAYS[d.getDay()]}, ${d.getDate()} ${RU_MONTHS_GEN[d.getMonth()]}`;
  return `${EN_WEEKDAYS[d.getDay()]}, ${EN_MONTHS[d.getMonth()]} ${d.getDate()}`;
}

function formatDayDate(dateStr) {
  if (!dateStr) return t('earlier') || 'Earlier';
  const d = new Date(dateStr);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const itemDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.floor((today - itemDay) / 86400000);

  // Show actual date with day label
  const dayNum = d.getDate();
  const month = lang === 'ru' ? RU_MONTHS_GEN[d.getMonth()] : EN_MONTHS[d.getMonth()];

  if (diff === 0) return `${t('today')}, ${dayNum} ${month}`;
  if (diff === 1) return `${t('yesterday')}, ${dayNum} ${month}`;
  return `${dayNum} ${month}`;
}

function getDateKey(dateStr) {
  if (!dateStr) return '9999';
  const d = new Date(dateStr);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleTimeString(lang === 'ru' ? 'ru-RU' : 'en-US', { hour: '2-digit', minute: '2-digit' });
}

// ─── Currency helpers ─────────────────────────────
const CURRENCY_SYMBOLS = {
  'THB': '฿', 'RUB': '₽', 'USD': '$', 'EUR': '€', 'GBP': '£',
  'JPY': '¥', 'CNY': '¥', 'TRY': '₺', 'UAH': '₴', 'KRW': '₩',
  'SGD': 'S$', 'INR': '₹', 'AUD': 'A$', 'CAD': 'C$', 'CHF': 'CHF',
  'VND': '₫', 'IDR': 'Rp', 'MYR': 'RM', 'PHP': '₱', 'BRL': 'R$',
  'AED': 'د.إ', 'HKD': 'HK$', 'ILS': '₪',
};

function currencySym(code) {
  if (!code) return '';
  return CURRENCY_SYMBOLS[code.toUpperCase()] || code.toUpperCase();
}

function parseAmountNum(raw) {
  if (!raw) return 0;
  let s = String(raw).replace(/[^\d.,]/g, '');
  if (!s) return 0;
  // Fix comma handling: "1,800" → 1800 (thousands), "1,8" → 1.8 (decimal)
  if (s.split(',').length > 2) {
    s = s.replace(/,/g, '');
  } else if (s.includes(',')) {
    const [before, after] = s.split(',', 2);
    if (after.length === 3 && /^\d+$/.test(after)) {
      s = before + after;
    } else {
      s = before + '.' + after;
    }
  } else if (s.split('.').length > 2) {
    s = s.replace(/\./g, '');
  }
  const num = parseFloat(s);
  return isNaN(num) ? 0 : num;
}

function formatAmount(amount, currency) {
  if (!amount && amount !== 0) return '';
  const num = parseAmountNum(amount);
  if (num === 0 && !String(amount).match(/\d/)) return String(amount);
  const formatted = num.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const sym = currencySym(currency);
  return sym ? formatted + ' ' + sym : formatted;
}

const CATEGORY_ICONS = {

  'entertainment': '🎬', 'movie': '🎬', 'кино': '🎬',
  'subscription': '📱', 'подписка': '📱', 'netflix': '📱',
  'transfer': '💸', 'перевод': '💸',
  'receipt': '🧾', 'чек': '🧾',
  'bank': '🏦', 'commission': '🏦', 'комиссия': '🏦',
  'salary': '💰', 'зарплата': '💰', 'income': '💵', 'доход': '💵', 'фриланс': '💻',
};

function getItemIcon(desc, cat) {
  if (!desc && !cat) return '💰';
  const combined = (desc || '') + ' ' + (cat || '');
  const lower = combined.toLowerCase();
  for (const [key, icon] of Object.entries(CATEGORY_ICONS)) {
    if (lower.includes(key)) return icon;
  }
  return '💰';
}

// ─── Exchange rates (client-side cache) ───────────
let _ratesCache = null;
let _ratesCacheTime = 0;
const RATES_TTL = 3600000; // 1 hour in ms

async function fetchRates() {
  const now = Date.now();
  if (_ratesCache && now - _ratesCacheTime < RATES_TTL) return _ratesCache;
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    if (data.rates) {
      _ratesCache = data.rates;
      _ratesCacheTime = now;
      return _ratesCache;
    }
  } catch(e) { console.warn('Rate fetch failed:', e); }
  return null;
}

function convertToBase(amount, fromCur, baseCur, rates) {
  if (!fromCur || fromCur === baseCur || !rates) return amount;
  const fromRate = rates[fromCur];
  const toRate = rates[baseCur];
  if (!fromRate || !toRate) return amount;
  return (amount / fromRate) * toRate;
}

// Determine the user's base currency from their expenses
function detectBaseCurrency(expenses) {
  // Count currency occurrences in recent expenses
  const counts = {};
  expenses.forEach(e => {
    const c = (e.currency || '').toUpperCase();
    if (c) counts[c] = (counts[c] || 0) + 1;
  });
  // Return most common currency, fallback to USD
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return sorted.length > 0 ? sorted[0][0] : 'USD';
}

// ─── Compute stats ─────────────────────────────────
function computeStats() {
  const expenses = window._data?.expenses || [];
  const todos = window._data?.todos || [];
  const now = new Date();
  const weekAgo = new Date(now - 7 * 86400000);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  const baseCur = window._baseCurrency || 'USD';
  const rates = _ratesCache;

  let weekTotal = 0, monthSpent = 0, monthEarned = 0;
  const categoryTotals = {};
  let mixedCurrencies = false;

  expenses.forEach(e => {
    const rawNum = parseAmountNum(e.amount);
    if (!rawNum) return;
    const eCur = (e.currency || '').toUpperCase() || baseCur;
    if (eCur !== baseCur) mixedCurrencies = true;
    const num = convertToBase(rawNum, eCur, baseCur, rates);
    const d = new Date(e.created_at || 0);
    if (d >= weekAgo) weekTotal += num;
    if (d >= monthStart) {
      const isIncome = (e.category || '') === 'income';
      if (isIncome) {
        monthEarned += num;
      } else {
        monthSpent += num;
        const cat = e.description?.split(' ')[0] || 'other';
        categoryTotals[cat] = (categoryTotals[cat] || 0) + num;
      }
    }
  });

  const activeTodos = todos.filter(t => !t.done).length;
  const balance = monthEarned - monthSpent;

  return { weekTotal, monthSpent, monthEarned, balance, categoryTotals, activeTodos, expenseCount: expenses.length, baseCur, mixedCurrencies };
}

// ─── Render ────────────────────────────────────────
function renderSummary() {
  const stats = computeStats();
  const baseSym = currencySym(stats.baseCur);
  const mixedNote = stats.mixedCurrencies ? ` <span style="font-size:11px;opacity:0.6">(${lang === 'ru' ? 'конвертировано в' : 'converted to'} ${stats.baseCur})</span>` : '';
  const balanceColor = stats.balance >= 0 ? 'green' : 'red';
  const balanceSign = stats.balance >= 0 ? '+' : '';
  document.getElementById('summary').innerHTML = `
    <div class="summary-card">
      <div class="summary-label">${t('total_spent')}</div>
      <div class="summary-value red">${formatAmount(stats.monthSpent, stats.baseCur)}</div>
      ${mixedNote}
      <div class="balance-row">
        <div class="balance-dot ${balanceColor}"></div>
        <div class="balance-text">${t('balance')}: ${balanceSign}${formatAmount(Math.abs(stats.balance), stats.baseCur)}</div>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-label">${t('total_earned')}</div>
      <div class="summary-value green">${formatAmount(stats.monthEarned, stats.baseCur)}</div>
      <div class="summary-sub">${t('this_week')}: ${formatAmount(stats.weekTotal, stats.baseCur)} · ${t('tasks_count')}: ${stats.activeTodos}</div>
    </div>
  `;
}

function renderTabs() {
  const tabIds = ['expenses', 'todos', 'movements', 'events'];
  document.getElementById('tabs').innerHTML = t('tabs').map((name, i) =>
    `<button class="tab${tabIds[i] === currentTab ? ' active' : ''}" onclick="switchTab('${tabIds[i]}')">${name}</button>`
  ).join('');
}

function renderTip() {
  if (hiddenTips.has(currentTab)) { document.getElementById('tipArea').innerHTML = ''; return; }
  const tips = {
    expenses: t('tip_expenses'),
    todos: t('tip_todos'),
    movements: t('tip_places'),
    events: t('tip_calendar'),
  };
  const text = tips[currentTab];
  if (!text) return;
  document.getElementById('tipArea').innerHTML = `
    <div class="tip-banner">
      <button class="tip-close" onclick="hideTip()">×</button>
      ${text}
    </div>`;
}

function hideTip() {
  hiddenTips.add(currentTab);
  document.getElementById('tipArea').innerHTML = '';
}

function render() {
  document.getElementById('headerDate').textContent = formatHeaderDate();
  renderSummary();
  renderTabs();
  renderTip();
  loadSection(currentTab);
}

function switchTab(name) {
  currentTab = name;
  renderTabs();
  renderTip();
  loadSection(name);
}

// ─── Sections ──────────────────────────────────────
function setContent(html) {
  const el = document.getElementById('content');
  el.innerHTML = html;
}

function emptyState(icon, title, sub, commands) {
  let html = `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div><div class="empty-sub">${sub}</div>`;
  if (commands) {
    html += '<div class="empty-commands">';
    commands.forEach(c => {
      html += `<div class="cmd-row"><span class="cmd">${c[0]}</span><span class="cmd-desc">${c[1]}</span></div>`;
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function loadExpenses() {
  const expenses = window._data?.expenses || [];
  if (!expenses.length) {
    setContent(emptyState('🧾', t('no_expenses'), t('no_expenses_sub'), [
      [t('cmd_photo'), ''],
      [t('cmd_text'), ''],
      [t('cmd_income'), ''],
      [t('cmd_undo'), ''],
    ]));
    return;
  }

  // Group by actual date
  const groups = {};
  expenses.forEach(e => {
    const key = getDateKey(e.created_at);
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  // Sort date keys descending
  const sortedKeys = Object.keys(groups).sort().reverse();

  let html = '';
  sortedKeys.forEach(key => {
    const items = groups[key];
    const label = formatDayDate(items[0].created_at);
    html += `<div class="date-group"><div class="date-label">${escHtml(label)}</div>`;
    items.forEach(e => {
      const isIncome = (e.category || '') === 'income';
      const icon = getItemIcon(e.description, e.category);
      const title = (e.description || e.category || '').split('(')[0].trim();
      const amtClass = isIncome ? 'green' : 'red';
      const iconClass = isIncome ? 'income' : 'expense';
      const meta = formatTime(e.created_at);
      html += `
        <div class="item" data-id="${e.id}">
          <div class="item-icon ${iconClass}">${icon}</div>
          <div class="item-body">
            <div class="item-title">${escHtml(title)}</div>
            <div class="item-meta">${escHtml(meta)}</div>
          </div>
          <div class="item-amount ${amtClass}">${isIncome ? '+' : '-'}${formatAmount(e.amount, e.currency)}</div>
          <button class="item-delete" onclick="deleteExpense(${e.id})" title="${t('delete_confirm')}">✕</button>
        </div>`;
    });
    html += '</div>';
  });

  // Category breakdown (expenses only)
  const stats = computeStats();
  const cats = Object.entries(stats.categoryTotals).sort((a, b) => b[1] - a[1]);
  if (cats.length > 1) {
    const maxCat = cats[0][1];
    const colors = ['#6c5ce7','#ff6b6b','#51cf66','#ffa94d','#74c0fc','#a29bfe','#fd79a8','#fdcb6e'];
    html += `<div class="date-group"><div class="date-label">${t('by_category')}</div><div class="cat-card">`;
    cats.slice(0, 6).forEach(([cat, total], i) => {
      const pct = Math.round((total / maxCat) * 100);
      html += `
        <div class="cat-bar-wrap">
          <div class="cat-bar-label"><span>${escHtml(cat)}</span><span>${formatAmount(total)}</span></div>
          <div class="cat-bar"><div class="cat-bar-fill" style="width:${pct}%;background:${colors[i % colors.length]}"></div></div>
        </div>`;
    });
    html += '</div></div>';
  }

  setContent(html);
}

function loadTodos() {
  const todos = window._data?.todos || [];
  const active = todos.filter(t => !t.done);
  const done = todos.filter(t => t.done);

  if (!todos.length) {
    setContent(emptyState('✅', t('no_todos'), t('no_todos_sub'), [
      [t('cmd_todo'), ''],
    ]));
    return;
  }

  let html = '';
  if (active.length) {
    html += '<div class="date-group"><div class="date-label">' + (lang === 'ru' ? 'Активные' : 'Active') + ` <span style="color:var(--accent2)">${active.length}</span></div>`;
    active.forEach(t => {
      html += `
        <div class="item" data-id="${t.id}">
          <button class="todo-check" onclick="toggleTodo(${t.id})">☐</button>
          <div class="item-body">
            <div class="item-title">${escHtml(t.title)}</div>
          </div>
        </div>`;
    });
    html += '</div>';
  }
  if (done.length) {
    html += '<div class="date-group"><div class="date-label">' + (lang === 'ru' ? 'Выполненные' : 'Completed') + '</div>';
    done.slice(0, 10).forEach(t => {
      html += `
        <div class="item" data-id="${t.id}" style="opacity:0.5">
          <div class="todo-check done">✓</div>
          <div class="item-body">
            <div class="item-title todo-title done">${escHtml(t.title)}</div>
          </div>
        </div>`;
    });
    html += '</div>';
  }

  setContent(html);
}

function loadMovements() {
  const movements = window._data?.movements || [];
  if (!movements.length) {
    setContent(emptyState('📍', t('no_movements'), t('no_movements_sub'), [
      [t('cmd_place'), ''],
    ]));
    return;
  }

  const groups = {};
  movements.forEach(m => {
    const key = getDateKey(m.created_at);
    if (!groups[key]) groups[key] = [];
    groups[key].push(m);
  });

  const sortedKeys = Object.keys(groups).sort().reverse();

  let html = '';
  sortedKeys.forEach(key => {
    const items = groups[key];
    const label = formatDayDate(items[0].created_at);
    html += `<div class="date-group"><div class="date-label">${escHtml(label)}</div>`;
    items.forEach(m => {
      html += `
        <div class="item">
          <div class="item-icon movement">📍</div>
          <div class="item-body">
            <div class="item-title">${escHtml(m.location || '')}</div>
            <div class="item-meta">${formatTime(m.created_at)}${m.description ? ' · ' + escHtml(m.description) : ''}</div>
          </div>
        </div>`;
    });
    html += '</div>';
  });

  setContent(html);
}

function loadEvents() {
  const events = window._data?.events || [];
  if (!events.length) {
    setContent(emptyState('📅', t('no_events'), t('no_events_sub'), [
      [t('cmd_event'), ''],
    ]));
    return;
  }

  let html = '<div class="date-group">';
  events.forEach(e => {
    const d = e.event_data || {};
    html += `
      <div class="event-card">
        <div class="event-title">${escHtml(d.summary || 'Event')}</div>
        <div class="event-time">${[d.date, d.time].filter(Boolean).join(' · ') || ''}</div>
      </div>`;
  });
  html += '</div>';

  setContent(html);
}

function loadSection(name) {
  switch(name) {
    case 'expenses': loadExpenses(); break;
    case 'todos': loadTodos(); break;
    case 'movements': loadMovements(); break;
    case 'events': loadEvents(); break;
  }
}

// ─── Actions ───────────────────────────────────────
let _tokenCache = null;
async function getToken() {
  if (_tokenCache) return _tokenCache;
  const secret = 'sasha-dashboard-2026';
  const data = new TextEncoder().encode(userId + secret);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  _tokenCache = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  return _tokenCache;
}

async function deleteExpense(id) {
  if (!confirm(t('delete_confirm'))) return;
  try {
    const token = await getToken();
    const res = await fetch(`/api/dashboard/delete_expense?user_id=${userId}&token=${token}&expense_id=${id}`, { method: 'POST' });
    if (res.ok) {
      window._data.expenses = window._data.expenses.filter(e => e.id !== id);
      render();
    }
  } catch(e) {
    console.error('Delete failed:', e);
  }
}

async function toggleTodo(id) {
  try {
    const token = await getToken();
    const res = await fetch(`/api/dashboard/toggle_todo?user_id=${userId}&token=${token}&todo_id=${id}`, { method: 'POST' });
    if (res.ok) {
      const todo = window._data.todos.find(t => t.id === id);
      if (todo) todo.done = !todo.done;
      render();
    }
  } catch(e) {
    console.error('Toggle failed:', e);
  }
}

// ─── Currency toggle ──────────────────────────────────
function buildCurrencyToggle(currencies) {
  const curList = currencies && currencies.length >= 2 ? currencies : ['USD', 'EUR'];
  const active = curList.includes(window._baseCurrency) ? window._baseCurrency : curList[0];
  window._baseCurrency = active;
  document.getElementById('currencyToggle').innerHTML = curList.map(c =>
    `<button data-cur="${c}" class="${active === c ? 'active' : ''}" onclick="setBaseCur('${c}')">${c}</button>`
  ).join('');
}

function setBaseCur(cur) {
  window._baseCurrency = cur;
  try { localStorage.setItem('sasha_base_currency', cur); } catch(e) {}
  document.querySelectorAll('#currencyToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.cur === cur);
  });
  render();
}

// ─── Utility ───────────────────────────────────────
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ─── Load data ─────────────────────────────────────
async function loadData() {
  try {
    const token = await getToken();
    const res = await fetch('/api/dashboard?user_id=' + userId + '&token=' + token);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    window._data = json;
    lang = json.lang === 'ru' ? 'ru' : json.lang === 'es' ? 'es' : 'en';
    // Use user's currency setting from server, fallback to detecting from expenses
    const userCur = json.user_currency || detectBaseCurrency(json.expenses || []);
    let base = userCur;
    // Allow manual override via localStorage
    try {
      const saved = localStorage.getItem('sasha_base_currency');
      if ((json.toggle_currencies || []).includes(saved)) base = saved;
    } catch(e) {}
    window._baseCurrency = base;
    // Build toggle: currencies from server (USD + user's lang-based currencies)
    buildCurrencyToggle(json.toggle_currencies);
    // Fetch exchange rates in background, then re-render
    fetchRates().then(() => render());
    render();
  } catch (e) {
    setContent(`<div class="error-state"><div>⚠️</div><p>${lang === 'ru' ? 'Ошибка загрузки' : 'Failed to load'}</p></div>`);
  }
}

loadData();
</script>
